<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CollabNotes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">CollabNotes</div>
    <div class="sidebar-section-title">Workspace</div>
    <select id="workspace-select" class="workspace-select"></select>
    <div class="sidebar-section-title">Pages</div>
    <div id="page-tree" class="page-tree"></div>
    <div class="sidebar-actions">
      <button id="new-page-btn" class="text-btn">+ New page</button>
      <button id="new-workspace-btn" class="text-btn">+ New workspace</button>
      <button id="invite-btn" class="text-btn">+ Invite collaborator</button>
    </div>
    <div class="sidebar-footer"><span id="me-label"></span><button id="logout-btn" class="logout-link">Log out</button></div>
  </aside>
  <main class="editor-area">
    <div class="editor-topbar"><div class="presence-strip" id="presence-strip"></div><div class="save-state" id="save-state">&nbsp;</div></div>
    <div id="editor-scroll" class="editor-scroll" style="display:none;">
      <div class="editor-page">
        <input id="page-title" class="page-title-input" placeholder="Untitled">
        <div class="editor-hint">Write freely. Use the block controls to shape your page.</div>
        <div id="block-list" class="block-list"></div>
        <button id="add-block-btn" class="add-block-btn">＋ Add block</button>
      </div>
    </div>
    <div id="empty-state" class="empty-state"><div>Select a page from the sidebar, or create a new one.</div></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
