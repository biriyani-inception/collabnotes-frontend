<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CollabNotes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-brand">CollabNotes</p>
    <p class="auth-tagline">Real-time collaborative notes, built on Spring Boot &amp; STOMP.</p>

    <div class="tabs">
      <button class="tab active" data-tab="login">Log in</button>
      <button class="tab" data-tab="register">Sign up</button>
    </div>

    <div id="form-error" class="form-error" style="display:none;"></div>

    <form id="login-form" class="form-pane active">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn-primary">Log in</button>
    </form>

    <form id="register-form" class="form-pane">
      <div class="field">
        <label>Name</label>
        <input type="text" id="register-name" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="register-email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="register-password" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary">Create account</button>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'app.html';

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-pane').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + '-form').classList.add('active');
      hideError();
    });
  });

  function showError(msg) {
    const el = document.getElementById('form-error');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideError() {
    document.getElementById('form-error').style.display = 'none';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    try {
      const res = await Api.login(
        document.getElementById('login-email').value,
        document.getElementById('login-password').value
      );
      Auth.save(res);
      window.location.href = 'app.html';
    } catch (err) {
      showError(err.message);
    }
  });

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    try {
      const res = await Api.register(
        document.getElementById('register-name').value,
        document.getElementById('register-email').value,
        document.getElementById('register-password').value
      );
      Auth.save(res);
      window.location.href = 'app.html';
    } catch (err) {
      showError(err.message);
    }
  });
</script>
</body>
</html>
